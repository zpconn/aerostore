format_version = 1

[[assumptions]]
id = "TOOLCHAIN"
scope = "All implemented proof slices"
statement = "Pinned verifier frontends, extraction, standard models, proof erasure, Rust/LLVM, and proof checkers implement their documented semantics. Exact pins and evidence accompany each run."

[[assumptions]]
id = "ALLOCATION"
scope = "Safe kernel functions"
statement = "Pinned vector models assume logical allocation success. Rust additionally enforces representable byte capacities and may panic/abort on capacity or allocation failure. Arbitrary-size successful allocation and real-time bounds are not claimed. The production bitmap corollary fixes bucket count to 4096; successful allocation remains an explicit assumption."

[[assumptions]]
id = "EXTRACTION"
scope = "Rust-to-Lean functions"
statement = "Charon/Aeneas translation and listed external library models are trusted. Handwritten protocol models are not substituted for extracted implementations."

[[assumptions]]
id = "MODEL-CORRESPONDENCE"
scope = "Standalone TLA+ and Lean protocol models"
statement = "Mapping to the current Rust protocol is reviewed and tested, not a whole-engine mechanically checked refinement. Model checking cannot approve unverified implementation changes."

[[assumptions]]
id = "FROZEN-PRIMITIVES"
scope = "Initial performance experiment"
statement = "The experiment changes only the declared safe kernel. Atomic orderings, arena authority, callers, indexing semantics, and persistence are outside the proof slice and frozen by source fingerprints. Their safety is an open engine obligation."

[[assumptions]]
id = "CONCURRENT-PRIMITIVE-CONTRACTS"
scope = "Native commit control-flow proof"
statement = "Source-bound commit and callback cleanup bodies are proved parametrically over explicit event contracts. Actual row/index contents, lock coverage, atomic memory order, arena ownership, WAL durability, callback behavior and machine-clock no-wrap remain unproved native obligations; the operation proof establishes ordering conditional on those contracts."

[[assumptions]]
id = "PREDICATE-DATA-PRIMITIVES"
scope = "Native predicate dependency capture and publication algorithms"
statement = "Restricted source adapters preserve selected executable operations while lowering standard iteration and projecting data representations. Native registry and binding validity, key-to-bucket correspondence, canonical collections, held-guard stamp visibility and allocation success remain explicit primitive contracts. Publication state is an operation-local guarded projection; the reserved stamp may exceed the previous clock observation because other allocators can intervene. Reservation history and physical arena identity are explicit fields. Initial dependency uniqueness and valid change bindings must be established by callers. Controlled shared-clock composition derives freshness from native calls; arbitrary concurrent-history correspondence, no wraparound, raw-index completeness and MVCC ownership remain open. No Lean or TLA theorem is imported unchecked into Verus."

[[assumptions]]
id = "LIFECYCLE-ACQUIRED-INPUT"
scope = "Native ProcArray component proofs and controlled shared-clock scenario"
statement = "The modeled function input is an operation-local projection selected at lifecycle acquisition. Framing slots/history across lock_lifecycle is an additional modeling assumption, not a consequence of mutual exclusion and not an API-entry/return guarantee across a blocking wait. The controlled scenario excludes unmodeled slot transitions between its operations and while acquiring metadata exclusion. General refinement must introduce acquired-state and ownership/interference witnesses. Slot atomic projection, native mutex/RAII release, allocation, stable header identity and same-arena shared-clock correspondence remain unproved. Relaxed clock loads may lag the represented current counter; snapshot xmax uses the actual maximum-active compensation. Every represented reservation must remain below u64::MAX, including intervening allocations; the proof harness capacity branch is not a production exhaustion check."

[[assumptions]]
id = "GUARD-IDENTITY-OBSERVATION"
scope = "Native guard acquisition and predicate permission joins"
statement = "Registry ordinals and shared header offsets must be inverse mappings within the same physical arena. The actual acquisition loops prove which primitive guard is requested and retained in the returned vector. A successful lowest-level try_lock grants ownership of that exact mutex; native pointer validity, guard lifetime/Drop and Acquire/Release visibility must justify guarded stamp observations. Numeric guard records alone do not mint ownership. Existing commit event ordering does not by itself instantiate every data/ownership contract for arbitrary executions."

[[assumptions]]
id = "PUBLICATION-LABEL-ORDER"
scope = "Lean/TLA publication histories and native temporal composition"
statement = "Publication-label chronology is the shared allocator reservation order. Physical stores to disjoint guarded buckets may occur in another order, and a reader may start after reservation but before storage. Connecting globally fresh abstract publication histories to native stores requires a commuting-disjoint-updates or corresponding history argument; it is not supplied by the finite models or stamp comparison theorem."

[[assumptions]]
id = "GUARDED-SKIPLIST-LANES"
scope = "Native cached/fallback detachment and retirement ordering"
statement = "The live mutation guard and epoch pin protect typed node/predecessor/successor offsets. Each expected-target predecessor CAS has the stated per-lane detachment effect; guarded find accurately reports remaining target lanes and cannot reattach the target. Marking and lane operations preserve the target contents visible to pinned readers. Retirement defers reuse under the native epoch policy. The selected loop proof checks all-lane detachment before retirement; actual pointer validity, attached-predecessor ownership, CAS/search refinement, safe reuse and retry termination remain unproved native obligations."

[[assumptions]]
id = "POSTING-OWNERSHIP-PRIMITIVES"
scope = "Native destination preparation, rollback and source removal"
statement = "The caller supplies valid bindings, held key permissions derived from publication guards, distinct destinations and absence of every destination from the initial posting projection. These depend on final-write selection, before/after extraction, index consistency and row-base validation, whose native composition remains open. Successful insertion adds its absent target and insertion errors leave the logical posting set unchanged. Removal errors may have removed their target, but preserve unrelated postings. Poisoning sets the failure flag. These are explicit contracts on operation-local guarded projections, not proofs of the underlying unsafe index or instantaneous global poison visibility. Allocation panic, process death and arbitrary corruption remain outside this returned-Result proof."

[[assumptions]]
id = "PLATFORM"
scope = "Integration evidence"
statement = "Current target is x86_64 Linux/WSL2 with process-shared mappings. Integration tests are bounded evidence and do not prove OS, filesystem, crash, or mmap guarantees."
