scope = "Actual single-write ordinary publication and the checked native prepare/remove/publish segment join posting and row effects; initial row/posting coherence derives destination absence and successful final consistency. Validated plan, held authority and field primitive correspondence remain premises; this is not complete API-entry commit, arbitrary histories or WAL refinement"
status = "partial"
required_checks = ["commit-data", "commit-data-adapter-tests", "postings", "row-publication"]
refinement_roots = { commit-data = ["planned_derives_destination_ownership", "complete_postings_match_published_row", "prepare_destinations", "rollback_destinations", "remove_sources", "publish_rows_ordinary", "native_ordinary_data_segment", "create_move_delete_have_witnesses"] }

[[claims]]
id = "COMMIT-PUBLICATION-COMPLETION"
contract = "verification/commit_completion/README.md"
implementation = ["aerostore_core/src/occ_partitioned.rs", "aerostore_core/src/procarray.rs", "verification/commit_completion/completion.rs"]
scope = "One-write data publication joined to actual finish_transaction, shared-clock deregistration and predicate stamps, with returned write provenance and poisoning on late completion failures. Earlier clean data errors may leave the registration open for caller abort. Begins at a validated-plan cutpoint under enumerated lifecycle/storage/guard and cleanup contracts; full reader/writer concurrent-slice refinement, arbitrary native histories and full P1 remain open"
status = "partial"
required_checks = ["commit-completion", "commit-completion-adapter-tests", "commit-data", "lifecycle", "predicate", "concurrent", "p1-native"]
refinement_roots = { commit-completion = ["finish_transaction", "publication_changes", "publish_then_complete", "owned_registration_finishes", "completion_entry_has_live_witness", "completed_write_invalidates_capture"] }
