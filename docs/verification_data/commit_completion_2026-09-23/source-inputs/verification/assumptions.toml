format_version = 1

[[assumptions]]
id = "P0-REVIEWED-API-INVENTORY"
scope = "Contract and lock-relationship coverage audit"
statement = "The explicit inventory classifies covered, boundary and excluded public core paths and records reviewed success/error contracts. Its scanner and exact-source hashes detect drift; they do not infer all Rust semantics, prove documented caller preconditions, or establish native deadlock freedom. P0 completion depends on the inventory's separate reviewed audit-gap state, not the coverage command's success alone."

[[assumptions]]
id = "P1-NATIVE-SCHEDULE-EVIDENCE"
scope = "Complete transaction and retry native regressions"
statement = "Thread channels and existing test-only cutpoints select declared finite schedules in the actual engine. Positive executions and intended assertion-failing mutants support the corresponding protocol obligations without establishing arbitrary native histories, weak-memory semantics, or full P1 refinement. The native compiler, isolated fixtures, source identities, test selection, binaries and logs are pinned or authenticated by the campaign; serialization retries and resource errors retain their distinct lifecycle contracts."

[[assumptions]]
id = "TOOLCHAIN"
scope = "All implemented proof slices"
statement = "Pinned verifier frontends, extraction, standard models, proof erasure, Rust/LLVM, and proof checkers implement their documented semantics. Exact pins and evidence accompany each run."

[[assumptions]]
id = "ALLOCATION"
scope = "Safe kernel functions"
statement = "Pinned vector models assume logical allocation success. Rust additionally enforces representable byte capacities and may panic/abort on capacity or allocation failure. Arbitrary-size successful allocation and real-time bounds are not claimed. The production bitmap corollary fixes bucket count to 4096; successful allocation remains an explicit assumption."

[[assumptions]]
id = "EXTRACTION"
scope = "Rust-to-Lean functions"
statement = "Charon/Aeneas translation and listed external library models are trusted. Handwritten protocol models are not substituted for extracted implementations."

[[assumptions]]
id = "MODEL-CORRESPONDENCE"
scope = "Standalone TLA+ and Lean protocol models"
statement = "Mapping to the current Rust protocol is reviewed and tested, not a whole-engine mechanically checked refinement. Model checking cannot approve unverified implementation changes."

[[assumptions]]
id = "FROZEN-PRIMITIVES"
scope = "Initial performance experiment"
statement = "The experiment changes only the declared safe kernel. Atomic orderings, arena authority, callers, indexing semantics, and persistence are outside the proof slice and frozen by source fingerprints. Their safety is an open engine obligation."

[[assumptions]]
id = "CONCURRENT-PRIMITIVE-CONTRACTS"
scope = "Native commit control-flow proof"
statement = "Source-bound commit and callback cleanup bodies are proved parametrically over explicit event contracts. Actual row/index contents, lock coverage, atomic memory order, arena ownership, WAL durability, callback behavior and machine-clock no-wrap remain unproved native obligations; the operation proof establishes ordering conditional on those contracts."

[[assumptions]]
id = "PREDICATE-DATA-PRIMITIVES"
scope = "Native predicate dependency capture and publication algorithms"
statement = "Restricted source adapters preserve selected executable operations while lowering standard iteration and projecting data representations. Native registry and binding validity, key-to-bucket correspondence, canonical collections, held-guard stamp visibility and allocation success remain explicit primitive contracts. Publication state is an operation-local guarded projection; the reserved stamp may exceed the previous clock observation because other allocators can intervene. Reservation history and physical arena identity are explicit fields. Initial dependency uniqueness and valid change bindings must be established by callers. Controlled shared-clock composition derives freshness from native calls; arbitrary concurrent-history correspondence, no wraparound, raw-index completeness and MVCC ownership remain open. No Lean or TLA theorem is imported unchecked into Verus."

[[assumptions]]
id = "LIFECYCLE-ACQUIRED-INPUT"
scope = "Native ProcArray component proofs and controlled shared-clock scenario"
statement = "The modeled function input is an operation-local projection selected at lifecycle acquisition. Framing slots/history across lock_lifecycle is an additional modeling assumption, not a consequence of mutual exclusion and not an API-entry/return guarantee across a blocking wait. The controlled scenario excludes unmodeled slot transitions between its operations and while acquiring metadata exclusion. General refinement must introduce acquired-state and ownership/interference witnesses. Slot atomic projection, native mutex/RAII release, allocation, stable header identity and same-arena shared-clock correspondence remain unproved. Relaxed clock loads may lag the represented current counter; snapshot xmax uses the actual maximum-active compensation. Every represented reservation must remain below u64::MAX, including intervening allocations; the proof harness capacity branch is not a production exhaustion check."

[[assumptions]]
id = "GUARD-IDENTITY-OBSERVATION"
scope = "Native guard acquisition and predicate permission joins"
statement = "Registry ordinals and shared header offsets must be inverse mappings within the same physical arena. The actual acquisition loops prove which primitive guard is requested and retained in the returned vector. A successful lowest-level try_lock grants ownership of that exact mutex; native pointer validity, guard lifetime/Drop and Acquire/Release visibility must justify guarded stamp observations. Numeric guard records alone do not mint ownership. Existing commit event ordering does not by itself instantiate every data/ownership contract for arbitrary executions."

[[assumptions]]
id = "PUBLICATION-LABEL-ORDER"
scope = "Lean/TLA publication histories and native temporal composition"
statement = "Publication-label chronology is the shared allocator reservation order. Physical stores to disjoint guarded buckets may occur in another order, and a reader may start after reservation but before storage. Connecting globally fresh abstract publication histories to native stores requires a commuting-disjoint-updates or corresponding history argument; it is not supplied by the finite models or stamp comparison theorem."

[[assumptions]]
id = "GUARDED-SKIPLIST-LANES"
scope = "Native cached/fallback detachment and retirement ordering"
statement = "The live mutation guard and epoch pin protect typed node/predecessor/successor offsets. Each expected-target predecessor CAS has the stated per-lane detachment effect; guarded find accurately reports remaining target lanes and cannot reattach the target. Marking and lane operations preserve the target contents visible to pinned readers. Retirement defers reuse under the native epoch policy. The selected loop proof checks all-lane detachment before retirement; actual pointer validity, attached-predecessor ownership, CAS/search refinement, safe reuse and retry termination remain unproved native obligations."

[[assumptions]]
id = "POSTING-OWNERSHIP-PRIMITIVES"
scope = "Native destination preparation, rollback and source removal"
statement = "The caller supplies valid bindings, held key permissions derived from publication guards, distinct destinations and absence of every destination from the initial posting projection. These depend on final-write selection, before/after extraction, index consistency and row-base validation, whose general native caller composition remains open. The single-write commit-data composition separately derives destination absence from admitted row/posting coherence and key agreement. Successful insertion adds its absent target and insertion errors leave the logical posting set unchanged. Removal errors may have removed their target, but preserve unrelated postings. Poisoning sets the failure flag. These are explicit contracts on operation-local guarded projections, not proofs of the underlying unsafe index or instantaneous global poison visibility. Allocation panic, process death and arbitrary corruption remain outside this returned-Result proof."

[[assumptions]]
id = "PLATFORM"
scope = "Integration evidence"
statement = "Current target is x86_64 Linux/WSL2 with process-shared mappings. Integration tests are bounded evidence and do not prove OS, filesystem, crash, or mmap guarantees."

[[assumptions]]
id = "LIFECYCLE-WAIT-OWNERSHIP"
scope = "Interference-aware native lifecycle campaign"
statement = "A finite legal acquisition trace may register/end/reuse other slots, change retention horizons and advance the shared clock. Only the borrowed registration owner is protected. The native acquired suffix uses the resulting state, not API-entry metadata. Native registration is copyable; caller ownership discipline, unique arena authority, coherent abstract metadata cuts, mutex/atomic correspondence and a no-wrap policy covering every intervening reservation remain unproved. This campaign removes acquired-input framing from its modeled wait, without retroactively strengthening the older controlled scenario."

[[assumptions]]
id = "GUARD-AUTHORITY-INTERFERENCE"
scope = "Opaque lease and indexed-read composition"
statement = "One initial authority represents the valid physical arena/header/bucket domain. Actual CAS and Release-store bodies refine logical lease events under atomic primitive contracts; opaque affine leases cannot be forged or duplicated by clients. Scheduler cuts admit legal foreign transitions while preserving borrowed local leases; released keys may immediately be reacquired. Native authority construction, pointer/registry domain correspondence, Vec/RAII Drop elaboration, Acquire/Release visibility, weak memory and process-shared mappings remain trusted native boundaries."

[[assumptions]]
id = "LOOKUP-RETAINED-IMAGE-HISTORY"
scope = "Native MVCC materialization and indexed validation slice"
statement = "Storage operations expose a valid retained version-chain image and exact extracted index-key values for the operation. Indexed correspondence is restricted to the driver's fixed snapshot, selected index header and physical key-to-bucket projection. The raw current-posting lookup enumerates its guarded logical postings; the retained image maps to snapshot-visible replay of a coherent publication history. Native concurrent loads, partial multirow publication, pointers, allocator reuse, epoch/vacuum retention and payload/key extraction still require implementation refinement. Historical candidate completeness, private-write union, filtering and recorded-read provenance are derived within this boundary. The indexed slice selects its guarded history projection after acquisition and consumes guards before materialization; it does not assert a globally frozen physical heap."

[[assumptions]]
id = "ROW-PUBLICATION-FIELD-OWNERSHIP"
scope = "Actual single-write prepared publication and concrete storage composition"
statement = "A held native row-partition guard excludes other writers and vacuum on the projected chain; the prepared allocation is exclusively owned and unreachable from published heads. Slot and typed offset resolution identify represented fields, and individual xmax CAS, next store and head CAS have their specified atomic effects. Validated base identity, zero base xmax, coherent rank and new-version xmin are caller obligations. The actual loop derives publication states, including fallible prefixes, rather than receiving a whole-result or history-mapping contract. Physical mmap validity, pointer provenance, compiler weak-memory semantics, all native caller ownership and arbitrary multirow histories remain open. The ordinary single-write publication method has separate source-bound commit-data evidence under the same field contracts."

[[assumptions]]
id = "ROW-RETENTION-ACQUIRED-FIELDS"
scope = "Native acquired-row vacuum and selected publication/read/storage composition"
statement = "The proof starts after actual row-partition acquisition; the held guard excludes other row writers/vacuum on the projected chain. Individual head/row loads and next-field stores correspond to represented fields. Recycling a detached unlocked node records it free without changing its row fields; allocator pop, unique ownership, physical reuse and guard-wait interference remain native obligations. The caller supplies a valid snapshot, a reclamation horizon no greater than its xmin, active creator IDs no smaller than that xmin, and absence of this reader's own creator from the public projection. Vacuum derives first-visible preservation, exact successful pruning and report provenance. Cached traversal-prefix preservation additionally requires every node through the selected version to be ineligible, which the selected storage composition derives for its native publication geometry. No whole-heap concurrent-load correspondence is assumed proved."

[[assumptions]]
id = "STORAGE-SLICE-CUTPOINTS"
scope = "Shared native publication/retention/initialization/read vocabulary"
statement = "The selected storage slice begins from a coherent symbolic three-version layout. Its history equation and safe traversal prefix are derived from native operation effects for both older-active and future invisible creators, rather than assumed by the individual field primitives. Driver cuts share exact Image values, but physical same-arena capability transfer, load-to-projection refinement for an in-flight cursor, raw pointer validity, and exclusive allocator pop/ptr-write ownership remain unproved. The lifecycle horizon proof consumes acquired-state metadata under the existing component boundary; native registered-reader ownership across waits and release is not newly proved. The completed-event equation is snapshot replay, not index-posting/stamp chronology or general transaction-history induction. Later anchor reclamation is a separate pruned-state branch without intervening reuse. Whole-engine, weak-memory and arbitrary multirow history refinement remain open."

[[assumptions]]
id = "PUBLIC-VACUUM-HORIZON-DISPATCH"
scope = "Native public vacuum clamp and normal collector admission"
statement = "Exact native caller bodies use the table arena accessor and same-arena ProcArray/clock pair; the embedded native oldest_snapshot_xmin algorithm derives bounds for every active slot in its acquired metadata projection. The public caller clamps the requested horizon, while the normal collector forwards its one computation directly to the crate-private kernel. The dispatch contract records only the actual kernel argument and assumes no row-retention result. Existing lifecycle acquisition-state framing, native scoped guard release, physical arena correspondence and ownership of registrations until row acquisition and throughout the pass remain explicit boundaries; complete arbitrary concurrent horizon histories are not established by this caller theorem."

[[assumptions]]
id = "COMMIT-DATA-VALIDATED-PLAN"
scope = "Single-index single-write native posting/row composition"
statement = "The selected cutpoint supplies one changed logical key, matching row identity, a validated base and prepared private version, existing row/posting consistency and the required row/index authority. These are caller invariants, not conclusions supplied by a publication primitive. Under them the composed native helpers derive absent owned destinations, exact successful postings/row publication and all-or-poison returned failure semantics. The independent posting and row projections must denote disjoint fields of the same native storage; raw insert/remove and row atomic/pointer operations still satisfy their enumerated contracts. Projected key values do not prove full arbitrary payload or key-extractor correspondence. General final-write/change planning and every API-entry validation path remain outside this composition."

[[assumptions]]
id = "COMMIT-COMPLETION-CUTPOINT"
scope = "Native one-write publication followed by deregistration and stamping"
statement = "The admitted transaction registration and write plan denote the same writer, arena and registered index as the posting/row/stamp projections; physical same-arena identity across the independent projections is assumed, not established by this harness. Required guards remain held across the represented calls. Intervening private-set and recycle-cache cleanup preserves published projections; its native ownership and failure behavior is not newly proved by the joined harness. Prepublication data errors may leave the registration open and require caller abort; neither universal error cleanup nor a closed transaction on every Err is proved. Actual finish_transaction consumes the token and calls the existing acquired-state lifecycle algorithm; the shared-clock bridge then reserves and stores publication stamps. Existing acquired-input framing, no-wrap, native atomic/RAII and caller ownership boundaries remain explicit. The join does not establish registration/capture/validation from API entry, a complete indexed reader/writer execution or an arbitrary concurrent-history theorem."
